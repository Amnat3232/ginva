[package]
name = "ginva-pinocchio"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["std"]
std = []

[dependencies]
pinocchio = { version = "0.10", features = ["cpi"] }
pinocchio-system = "0.5"
pinocchio-token = "0.5"
solana-program-error = "3.0"
blake3 = "1.5"
constant_time_eq = "0.2"
base64ct = "=1.6.0"
hashbrown = "0.14"
[lints.rust]
unexpected_cfgs = "allow"

[profile.release]
overflow-checks = false
lto = false
codegen-units = 16
debug = 0
strip = true

# Pinocchio program builds standalone - not part of Anchor workspace
[workspace]
