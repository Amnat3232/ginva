[package]
name = "ginva-pinocchio"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["std"]
std = []

[dependencies]
pinocchio = "=0.1.0"
pinocchio-system = "=0.1.0"
pinocchio-token = "=0.1.0"
blake3 = "=1.5.0"
constant_time_eq = "=0.3.0"
base64ct = "=1.6.0"
hashbrown = "=0.14"
[lints.rust]
unexpected_cfgs = "allow"

# Pinocchio program builds standalone - not part of Anchor workspace
[workspace]
