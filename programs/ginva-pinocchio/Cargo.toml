[package]
name = "ginva-pinocchio"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["std"]
std = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
pinocchio = { version = "0.7", features = ["std"] }
pinocchio-pubkey = "0.1"
blake3 = "=1.5.0"
constant_time_eq = "=0.3.0"
base64ct = "=1.6.0"
hashbrown = "=0.14"
anchor-lang = { version = "0.29.0", features = ["idl-build"] }

[lints.rust]
unexpected_cfgs = "allow"

# Pinocchio program builds standalone - not part of Anchor workspace
[workspace]
