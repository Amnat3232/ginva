[package]
name = "ginva"
version = "2.0.0"
edition = "2021"

[features]
default = []        # 👈 Safe default (production mode)
devnet = []         # Enable for devnet deployment (2s timeout)
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
no-idl = []
anchor-debug = []
no-log-ix-name = []
local-test = []     # ⚠️ God Mode for testing only - disables oracle time checks

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
blake3 = { workspace = true }
constant_time_eq = { workspace = true }
pyth_solana_receiver_sdk = { workspace = true }
