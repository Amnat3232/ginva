[package]
name = "ginva"
version = "2.0.0"
edition = "2021"

[features]
default = []        # 👈 Safe default (production mode)
devnet = []         # Enable for devnet deployment (2s timeout)
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
no-idl = []
anchor-debug = []
no-log-ix-name = []
local-test = []     # ⚠️ God Mode for testing only - disables oracle time checks

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
blake3 = "1.5.0"
constant_time_eq = "0.3.1"
pyth_solana_receiver_sdk = { package = "pyth-solana-receiver-sdk", version = "0.3.0" }
