version: "3.8"
services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/build
      - cargo-cache:/usr/local/cargo/registry
      - solana-cache:/root/.local/share/solana
      - target-cache:/build/target
    environment:
      - CARGO_NET_GIT_FETCH_WITH_CLI=true
      - RUST_BACKTRACE=1
    command: anchor build

  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/build
      - cargo-cache:/usr/local/cargo/registry
      - solana-cache:/root/.local/share/solana
      - target-cache:/build/target
    environment:
      - CARGO_NET_GIT_FETCH_WITH_CLI=true
      - RUST_BACKTRACE=1
    command: anchor test

  shell:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/build
      - cargo-cache:/usr/local/cargo/registry
      - solana-cache:/root/.local/share/solana
      - target-cache:/build/target
    environment:
      - CARGO_NET_GIT_FETCH_WITH_CLI=true
    command: /bin/bash
    stdin_open: true
    tty: true

  deploy-devnet:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/build
      - cargo-cache:/usr/local/cargo/registry
      - solana-cache:/root/.local/share/solana
      - target-cache:/build/target
      - ~/.config/solana:/root/.config/solana:ro
    environment:
      - CARGO_NET_GIT_FETCH_WITH_CLI=true
      - ANCHOR_PROVIDER_CLUSTER=devnet
    command: anchor deploy --provider.cluster devnet

volumes:
  cargo-cache:
  solana-cache:
  target-cache:
