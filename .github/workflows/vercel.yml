name: Deploy to Vercel

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  VERCEL_TOKEN_CONFIGURED: ${{ secrets.VERCEL_TOKEN != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || '' }}
          NEXT_PUBLIC_SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL || 'https://api.devnet.solana.com' }}

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN_CONFIGURED == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: "--prod"
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        continue-on-error: true

      - name: Report Deployment Status
        if: always()
        run: |
          if [ "$VERCEL_TOKEN_CONFIGURED" == "true" ]; then
            echo "✅ Vercel deployment triggered"
          else
            echo "⚠️ Vercel deployment skipped (no token)"
          fi

      - name: Skip Vercel Deployment (No Token)
        if: env.VERCEL_TOKEN_CONFIGURED == 'false'
        run: echo "VERCEL_TOKEN not configured. Skipping Vercel deployment."
