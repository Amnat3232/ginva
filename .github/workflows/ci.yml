name: Ginva CI - Pinocchio

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "1.18.26"
  RUST_TOOLCHAIN: "nightly-2026-03-01"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "programs/ginva-pinocchio"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Solana & Rust
        run: |
          solana --version
          rustc --version
          cargo --version

      - name: Setup Wallet (เฉพาะ develop)
        if: github.ref == 'refs/heads/develop'
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
        run: |
          echo "$SOLANA_PRIVATE_KEY" > wallet.json
          chmod 600 wallet.json
          solana config set --keypair wallet.json --url devnet

      - name: Build Native Program
        run: |
          cd programs/ginva-pinocchio
          cargo build --release
          ls -lh target/release/libginva_pinocchio.so

      - name: Run Tests
        run: |
          cd programs/ginva-pinocchio
          cargo test --release

      - name: Build Frontend (ถ้ามี)
        run: |
          npm ci --legacy-peer-deps || echo "No package.json or skipped"
          npm run build --if-present || echo "No build script"

      - name: Notify Success (Discord/Telegram)
        if: success() && github.ref == 'refs/heads/develop'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "✅ Build & Test สำเร็จ"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"content": "✅ Ginva CI (Pinocchio) Successful!\n\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}"}'
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=✅ *Ginva CI (Pinocchio) Successful!*\n\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}"
          fi

  # Solana BPF Build Job
  build-bpf:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "programs/ginva-pinocchio"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install BPF toolchain
        run: |
          rustup target add bpfel-unknown-unknown || echo "BPF target may already be available"

      - name: Build Solana BPF Program
        run: |
          cd programs/ginva-pinocchio
          cargo build-sbf
          ls -lh target/release/deps/libginva_pinocchio*.so 2>/dev/null || ls -lh target/sbf-solana-solana/release/libginva_pinocchio.so 2>/dev/null

      - name: Upload BPF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginva-bpf-so
          path: |
            programs/ginva-pinocchio/target/release/deps/libginva_pinocchio*.so
            programs/ginva-pinocchio/target/sbf-solana-solana/release/libginva_pinocchio.so
          retention-days: 7

  # Security Audit - จาก github-actions-templates + cicd-automation-workflow-automate
  security-audit:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-bpf]
    permissions:
      contents: read
      security-events: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run Cargo Audit (Rust dependencies)
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run NPM Audit (Frontend dependencies)
        run: |
          npm audit --production || echo "⚠️ NPM vulnerabilities found"

  # Notification on Failure - จาก cicd-automation-workflow-automate
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: failure()

    steps:
      - name: Notify Discord on Failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "content": "❌ Ginva CI (Pinocchio) Failed!\n\nRepository: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nBranch: ${{ github.ref }}\nStatus: Failed\n\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }'
          fi

      - name: Notify Telegram on Failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=❌ *Ginva CI (Pinocchio) Failed!*\n\nRepository: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nBranch: ${{ github.ref }}\nStatus: Failed\n\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "parse_mode=Markdown"
          fi