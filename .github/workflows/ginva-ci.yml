name: Ginva CI (Pinocchio)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  SOLANA_VERSION: "1.18.26"
  RUST_VERSION: "nightly-2026-03-01"   # ตรงกับ rust-toolchain.toml

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === Rust + Cargo ===
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "programs/ginva-pinocchio"

      # === Solana CLI ===
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Solana
        run: solana --version

      # === Setup Wallet (สำหรับ devnet test / deploy) ===
      - name: Setup Wallet
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
        run: |
          echo "$SOLANA_PRIVATE_KEY" > wallet.json
          chmod 600 wallet.json
          solana config set --keypair wallet.json --url devnet
          solana config get

      # === Build Pinocchio Program ===
      - name: Build Program (Pinocchio)
        run: |
          cd programs/ginva-pinocchio
          cargo build --release
          echo "✅ Build Pinocchio สำเร็จ"

      # === Optional: Run tests ===
      - name: Run Tests
        run: |
          cd programs/ginva-pinocchio
          cargo test --release

      # === Frontend (ถ้าต้องการ build ด้วย) ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build Frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build --if-present

      - name: Summary
        run: echo "🎉 Ginva CI ผ่านหมดแล้ว (Pinocchio + Solana 1.18.26)"

  # Security Audit (เพิ่มเข้ามา)
  security-audit:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run NPM Audit
        run: npm audit --production

  # Notification on failure (เพิ่มเข้ามา)
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: failure()

    steps:
      - name: Notify Discord on Failure
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "❌ Ginva CI (Pinocchio) Failed!\n\nRepository: '${{ github.repository }}'\nWorkflow: '${{ github.workflow }}'\nBranch: '${{ github.ref }}'\nStatus: Failed\n\nCheck: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'
            }'
        continue-on-error: true

      - name: Notify Telegram on Failure
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ *Ginva CI (Pinocchio) Failed!*%0A%0ARepository: ${{ github.repository }}%0AWorkflow: ${{ github.workflow }}%0ABranch: ${{ github.ref }}%0AStatus: Failed%0A%0ACheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=Markdown"
        continue-on-error: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true