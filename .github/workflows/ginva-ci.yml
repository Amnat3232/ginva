name: Ginva CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SOLANA_VERSION: 1.18.18
  ANCHOR_VERSION: 0.30.1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: rust-lang/actions/setup@v2
        with:
          rust-version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL "https://release.solana.com/v${SOLANA_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install NPM dependencies
        run: npm install

      - name: Run Anchor Lint
        run: anchor lint

      - name: Run Anchor Build
        run: anchor build

      - name: Run Tests (Devnet)
        run: anchor test --skip-deploy
        env:
          ANCHOR_PROVIDER_CLUSTER: devnet
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com

  security-audit:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run NPM Audit
        run: npm audit --production

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-audit]
    if: failure()

    steps:
      - name: Notify Discord on Failure
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "❌ Ginva CI/CD Failed!\n\nRepository: '${{ github.repository }}'\nWorkflow: '${{ github.workflow }}'\nBranch: '${{ github.ref }}'\nStatus: Failed\n\nCheck: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'
            }'
        continue-on-error: true

      - name: Notify Telegram on Failure
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ *Ginva CI/CD Failed!*%0A%0ARepository: ${{ github.repository }}%0AWorkflow: ${{ github.workflow }}%0ABranch: ${{ github.ref }}%0AStatus: Failed%0A%0ACheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=Markdown"
        continue-on-error: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
