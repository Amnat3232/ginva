name: 🐳 Docker Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - "programs/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".dockerignore"
  pull_request:
    branches: [main, develop]
    paths:
      - "programs/**"
      - "docker-compose.yml"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  docker-build:
    name: Build with Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker build -t ginva-build:latest -f Dockerfile .

      - name: Run tests in Docker
        run: |
          docker run --rm -v $(pwd):/workspace ginva-build:latest \
            sh -c "cd /workspace/programs/ginva-pinocchio && cargo test --release"
        continue-on-error: true

      - name: Build Pinocchio program in Docker
        run: |
          docker run --rm -v $(pwd):/workspace ginva-build:latest \
            sh -c "cd /workspace/programs/ginva-pinocchio && cargo build --release"

      - name: Upload Program Binary
        uses: actions/upload-artifact@v4
        with:
          name: program-binary
          path: programs/ginva-pinocchio/target/release/libginva_pinocchio.so

  docker-compose-test:
    name: Test with Docker Compose
    runs-on: ubuntu-latest
    # Only run if docker-compose.yml exists
    if: fileExists('docker-compose.yml')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy environment file
        run: |
          cp .env.example .env || echo "No .env.example found"

      - name: Run tests with docker-compose
        run: |
          docker-compose -f docker-compose.yml up --build --abort-on-container-exit test
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.yml down -v
