name: 🔒 Code Quality & Security

env:
  RUST_TOOLCHAIN: nightly-2026-03-01

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security audit every Monday at 00:00 UTC
    - cron: "0 0 * * 1"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Run Rustfmt
        run: cargo fmt --manifest-path programs/ginva-pinocchio/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path programs/ginva-pinocchio/Cargo.toml -- -D warnings
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check formatting
        run: prettier --check "**/*.{js,ts,tsx,json,md}"
        continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo-audit
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva-pinocchio

      - name: Run cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run cargo-deny
        run: |
          cargo install cargo-deny || true
          cargo deny check 2>&1 || true
        working-directory: programs/ginva-pinocchio

      - name: Check dependencies for vulnerabilities
        run: |
          npm audit --audit-level=high
        continue-on-error: true

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust tools
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva-pinocchio

      - name: Install cargo-geiger
        run: cargo install cargo-geiger
        continue-on-error: true

      - name: Check for unsafe code
        run: |
          cd programs/ginva-pinocchio
          cargo geiger --output-format Json 2>&1 | jq -r '.packages[] | select(.unsafety.count.unsafe > 0) | "WARNING: Unsafe code found in \(.package.name): \(.unsafety.count.unsafe) blocks"' || true
        continue-on-error: true

      - name: Run cargo-udeps (unused dependencies)
        run: |
          cargo install cargo-udeps || true
          cd programs/ginva-pinocchio
          cargo udeps 2>&1 || true
        continue-on-error: true

  size-check:
    name: Binary Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-03-01

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev bzip2

      - name: Build Pinocchio program
        working-directory: programs/ginva-pinocchio
        run: cargo build --release

      - name: Check binary size
        run: |
          SIZE=$(ls -lh programs/ginva-pinocchio/target/release/libginva_pinocchio.so | awk '{print $5}')
          echo "Binary size: $SIZE"
          # Warning if over 1MB
          BYTES=$(stat -c%s programs/ginva-pinocchio/target/release/libginva_pinocchio.so)
          if [ $BYTES -gt 1048576 ]; then
            echo "⚠️ WARNING: Binary size exceeds 1MB"
          fi

      - name: Comment size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'programs/ginva-pinocchio/target/release/libginva_pinocchio.so';
            if (!fs.existsSync(path)) {
              console.log('Binary not found:', path);
              return;
            }
            const stats = fs.statSync(path);
            const sizeMB = (stats.size / 1024 / 1024).toFixed(2);

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 **Build Size Report**\n\nProgram binary size: **${sizeMB} MB**\n${stats.size > 1048576 ? '⚠️ Warning: Exceeds 1MB limit' : '✅ Size is acceptable'}`
            });
        continue-on-error: true
