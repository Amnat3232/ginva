name: 🚀 Build & Deploy Pinocchio (Solana Verified Build)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to devnet?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-verified:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Solana Verify CLI
        run: |
          cargo install solana-verify --locked

      - name: Build Verified Program
        working-directory: programs/ginva-pinocchio
        run: |
          solana-verify build --library-name ginva_pinocchio

      - name: Get Program Hash
        run: |
          solana-verify get-executable-hash programs/ginva-pinocchio/target/release/deploy/ginva_pinocchio.so

      - name: Upload Verified Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginva-verified-so
          path: programs/ginva-pinocchio/target/release/deploy/ginva_pinocchio.so
          retention-days: 1

  deploy-devnet:
    needs: build-verified
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy == 'true'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-verified-so
          path: .

      - name: Setup Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url devnet
          echo "${{ secrets.SOLANA_KEYPAIR }}" > keypair.json
          solana config set --keypair keypair.json

      - name: Deploy to Devnet
        run: |
          solana program deploy ginva_pinocchio.so --url devnet --max-sign-attempts 100
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}