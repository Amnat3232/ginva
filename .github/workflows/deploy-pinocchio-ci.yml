name: 🚀 Build & Deploy Pinocchio (Solana SBF)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to devnet?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Solana CLI + BPF
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install build tools (clang, llvm)
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential clang llvm

      - name: Disable cargo cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-nocache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-nocache-

      - name: Build BPF Program
        working-directory: programs/ginva-pinocchio
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          rm -f Cargo.lock
          rm -rf target
          cargo build-sbf --tools-version v1.45

      - name: Find Built Program
        run: |
          find programs/ginva-pinocchio/target -name "*.so" -type f | head -1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginva-sbf-so
          path: programs/ginva-pinocchio/target/deploy/ginva_pinocchio.so
          retention-days: 1

  deploy-devnet:
    needs: build-sbf
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy == 'true'
    permissions:
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-sbf-so
          path: .

      - name: Setup Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Wallet
        run: |
          echo "${{ secrets.SOLANA_KEYPAIR }}" > keypair.json
          solana config set --url devnet
          solana config set --keypair keypair.json
          solana address -k keypair.json

      - name: Deploy to Devnet
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana program deploy ginva_pinocchio.so --url devnet --max-sign-attempts 100 --skip-upgradeable-check