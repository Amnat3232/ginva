name: 🚀 Build & Deploy Pinocchio (Solana SBF)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to devnet?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup default stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install cargo-build-sbf --locked

      - name: Build SBF Program
        working-directory: programs/ginva-pinocchio
        run: |
          cargo build-sbf -- --release

      - name: Find Built Program
        run: |
          find programs/ginva-pinocchio/target -name "*.so" -type f | head -1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginva-sbf-so
          path: programs/ginva-pinocchio/target/deploy/ginva_pinocchio.so
          retention-days: 1

  deploy-devnet:
    needs: build-sbf
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy == 'true'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-sbf-so
          path: .

      - name: Setup Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url devnet
          echo "${{ secrets.SOLANA_KEYPAIR }}" > keypair.json
          solana config set --keypair keypair.json

      - name: Deploy to Devnet
        run: |
          solana program deploy ginva_pinocchio.so --url devnet --max-sign-attempts 100
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}