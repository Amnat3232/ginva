name: Build & Deploy Solana Program

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SOLANA_VERSION: "1.18.26"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ginva-solana"
          cache-targets: false

      - name: Install Anchor
        run: |
          npm install -g @coral-xyz/anchor
          echo "$(npm root -g)/@coral-xyz/anchor/cli/bin" >> $GITHUB_PATH

      - name: Verify Anchor
        run: anchor --version

      - name: Build program
        run: anchor build

      - name: Find and copy compiled program
        run: |
          mkdir -p target/deploy
          find target -name "libginva.so" -type f 2>/dev/null | head -1 | xargs -I {} cp {} target/deploy/ginva.so
          ls -la target/deploy/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginva-program
          path: target/deploy/ginva.so

  deploy-devnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar xjf solana.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url devnet
          solana config set --keypair /dev/stdin <<< "$SOLANA_KEYPAIR"

      - name: Deploy to Devnet
        run: |
          solana program deploy program/ginva.so
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}

  deploy-mainnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar xjf solana.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url mainnet-beta
          solana config set --keypair /dev/stdin <<< "$SOLANA_KEYPAIR"

      - name: Deploy to Mainnet
        run: |
          solana program deploy program/ginva.so
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
