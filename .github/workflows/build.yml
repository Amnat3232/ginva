name: Build & Deploy Solana Program

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SOLANA_VERSION: "1.18.26"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ginva-solana"
          cache-targets: false

      - name: Build Pinocchio program
        working-directory: programs/ginva-pinocchio
        run: cargo build --release

      - name: Find and copy compiled program
        run: |
          mkdir -p target/deploy
          find programs/ginva-pinocchio/target -name "*.so" -type f 2>/dev/null | head -1 | xargs -I {} cp {} target/deploy/ginva.so || true
          ls -la target/deploy/ 2>/dev/null || echo "No deploy directory"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ginva-program
          path: target/deploy/ginva.so
          retention-days: 5

  deploy-devnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: devnet
      url: https://explorer.solana.com/?cluster=devnet
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url devnet
          echo "$SOLANA_KEYPAIR" > keypair.json
          solana config set --keypair keypair.json
          echo "CARBIUM_RPC_URL=https://rpc.carbium.io/?apiKey=${{ secrets.CARBIUM_RPC_KEY }}" >> $GITHUB_ENV
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
          CARBIUM_RPC_KEY: ${{ secrets.CARBIUM_RPC_KEY }}

      - name: Deploy to Devnet
        run: solana program deploy program/ginva.so --max-sign-attempts 100

  deploy-mainnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://explorer.solana.com/?cluster=mainnet-beta
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url mainnet-beta
          solana config set --keypair /dev/stdin <<< "$SOLANA_KEYPAIR"

      - name: Deploy to Mainnet
        run: |
          solana program deploy program/ginva.so --max-sign-attempts 100
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployed to mainnet successfully!"
