name: Build & Deploy Solana Program

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SOLANA_VERSION: "1.18.26"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Solana CLI + BPF
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Disable cargo cache to avoid Cargo.lock v4
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-solana-nocache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-solana-nocache-

      - name: Build Pinocchio program
        working-directory: programs/ginva-pinocchio
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          rm -f Cargo.lock
          rm -rf target/
          # Downgrade constant_time_eq to work with older Rust
          cargo update constant_time_eq@0.4.3 --precise 0.2.8
          cargo build --release 2>&1

      - name: Find and copy compiled program
        run: |
          mkdir -p target/deploy
          find . -name "*.so" -type f 2>/dev/null | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ginva-program
          path: target/deploy/ginva.so
          retention-days: 5

  deploy-devnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: devnet
      url: https://explorer.solana.com/?cluster=devnet
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url devnet
          echo "$SOLANA_KEYPAIR" > keypair.json
          solana config set --keypair keypair.json
          echo "CARBIUM_RPC_URL=https://rpc.carbium.io/?apiKey=${{ secrets.CARBIUM_RPC_KEY }}" >> $GITHUB_ENV
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
          CARBIUM_RPC_KEY: ${{ secrets.CARBIUM_RPC_KEY }}

      - name: Deploy to Devnet
        run: solana program deploy program/ginva.so --max-sign-attempts 100

  deploy-mainnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://explorer.solana.com/?cluster=mainnet-beta
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url mainnet-beta
          solana config set --keypair /dev/stdin <<< "$SOLANA_KEYPAIR"

      - name: Deploy to Mainnet
        run: |
          solana program deploy program/ginva.so --max-sign-attempts 100
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployed to mainnet successfully!"
