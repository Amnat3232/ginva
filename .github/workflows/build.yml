name: Build & Deploy Solana Program

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SOLANA_VERSION: "1.18.26"
  RUST_VERSION: "1.85.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ginva-solana"
          cache-targets: false

      - name: Install Solana CLI
        run: |
          for i in 1 2 3; do
            sh -c "$(curl -sSfL 'https://release.solana.com/v${{ env.SOLANA_VERSION }}/install')" && break
            echo "Retrying Solana CLI install..."
            sleep 5
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Solana
        run: solana --version

      - name: Build program
        run: cargo build --release -p ginva

      - name: Copy to deploy directory
        run: |
          mkdir -p target/deploy
          cp target/release/libginva.so target/deploy/ginva.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginva-program
          path: target/deploy/ginva.so

  deploy-devnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          for i in 1 2 3; do
            sh -c "$(curl -sSfL 'https://release.solana.com/v${{ env.SOLANA_VERSION }}/install')" && break
            echo "Retrying Solana CLI install..."
            sleep 5
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url devnet
          solana config set --keypair /dev/stdin <<< "$SOLANA_KEYPAIR"

      - name: Deploy to Devnet
        run: |
          solana program deploy program/ginva.so
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}

  deploy-mainnet:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ginva-program
          path: ./program

      - name: Install Solana CLI
        run: |
          for i in 1 2 3; do
            sh -c "$(curl -sSfL 'https://release.solana.com/v${{ env.SOLANA_VERSION }}/install')" && break
            echo "Retrying Solana CLI install..."
            sleep 5
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        run: |
          solana config set --url mainnet-beta
          solana config set --keypair /dev/stdin <<< "$SOLANA_KEYPAIR"

      - name: Deploy to Mainnet
        run: |
          solana program deploy program/ginva.so
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
