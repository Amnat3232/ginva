name: 🚀 Auto Deploy to Devnet

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "ginva-vault/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploy"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  SOLANA_VERSION: 1.18.26
  RUST_TOOLCHAIN: stable

jobs:
  deploy:
    name: Build & Deploy to Devnet
    runs-on: ubuntu-latest
    environment:
      name: devnet
      url: https://explorer.solana.com/?cluster=devnet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva-pinocchio

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://release.anza.xyz/v1.18.26/install" | sh
        shell: bash

      - name: Add Solana to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install BPF Toolchain
        run: |
          solana-install update bpf

      - name: Build Pinocchio Program
        working-directory: programs/ginva-pinocchio
        run: |
          cargo build-bpf --release

      - name: Run Tests
        if: ${{ !inputs.skip_tests }}
        working-directory: programs/ginva-pinocchio
        run: |
          cargo test --release

      - name: Setup Deployer Keypair
        run: |
          echo "$SOLANA_KEYPAIR" > deploy-keypair.json
          solana config set --keypair deploy-keypair.json --url devnet
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}

      - name: Deploy to Devnet
        working-directory: programs/ginva-pinocchio
        run: |
          solana program deploy target/release/ginva-pinocchio.so --url devnet
        env:
          SOLANA_CLUSTER: devnet

      - name: Verify Deployment
        run: |
          PROGRAM_ID=$(solana program show programs/ginva-pinocchio/target/release/ginva-pinocchio.so --url devnet 2>/dev/null | grep "Program Id:" | awk '{print $3}' || echo "Manual check required")
          echo "✅ Deployed to: $PROGRAM_ID"
          echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT