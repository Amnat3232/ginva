name: Deploy to Devnet

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploy"
        type: boolean
        default: false
  push:
    branches:
      - develop
      - main
    paths:
      - "programs/**"
      - "Anchor.toml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./programs/ginva

      - name: Install Solana CLI
        run: |
          SOLANA_VERSION="v1.18.26"
          curl -fSLo /tmp/solana-release.tar.bz2 "https://github.com/solana-labs/solana/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p "$HOME/.local/share/solana"
          tar xjf /tmp/solana-release.tar.bz2 -C "$HOME/.local/share/solana"
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sf "$HOME/.local/share/solana/solana-release/bin" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Setup Wallet
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "${{ secrets.SOLANA_PRIVATE_KEY }}" > wallet.json
          solana config set --keypair wallet.json --url devnet

      - name: Install Anchor
        run: npm install -g @coral-xyz/anchor

      - name: Install Yarn dependencies
        run: yarn install

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: anchor test
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com

      - name: Build Program
        run: anchor build
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com

      - name: Show Program ID
        run: |
          echo "Program ID: $(grep -A1 '\[programs.devnet\]' Anchor.toml | tail -n1 | awk '{print $3}')"

      - name: Deploy to Devnet
        run: anchor deploy
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com

      - name: Generate IDL
        run: anchor idl init --filepath target/idl/ginva.json $(grep -A1 '\[programs.devnet\]' Anchor.toml | tail -n1 | awk '{print $3}')
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com

      - name: Copy IDL to frontend
        run: cp target/idl/ginva.json app/src/idl/ginva.json

      - name: Commit IDL changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update IDL after devnet deploy"
          file_pattern: "app/src/idl/ginva.json"
