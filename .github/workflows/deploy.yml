name: Deploy to Devnet

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0

      - name: Install Solana CLI
        run: |
          SOLANA_VERSION="v1.18.26"
          curl -fSLo /tmp/solana-release.tar.bz2 "https://github.com/solana-labs/solana/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p "$HOME/.local/share/solana"
          tar xjf /tmp/solana-release.tar.bz2 -C "$HOME/.local/share/solana"
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sf "$HOME/.local/share/solana/solana-release/bin" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Setup Wallet
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "${{ secrets.SOLANA_PRIVATE_KEY }}" > wallet.json
          solana config set --keypair wallet.json --url devnet

      - name: Install Anchor
        run: npm install -g @coral-xyz/anchor

      - name: Build Program
        run: anchor build
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com

      - name: Deploy to Devnet
        run: anchor deploy
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
