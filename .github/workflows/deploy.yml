name: 🚀 Auto Deploy to Devnet

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "ginva-vault/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploy"
        type: boolean
        default: false

env:
  SOLANA_VERSION: 1.18.26
  RUST_TOOLCHAIN: 1.75.0

jobs:
  build-and-deploy:
    name: Build & Deploy to Devnet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev bzip2

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva-pinocchio

      - name: Install Solana CLI
        run: |
          sudo apt-get update && sudo apt-get install -y bzip2
          SOLANA_VERSION="v${{ env.SOLANA_VERSION }}"
          curl -fSLo /tmp/solana-release.tar.bz2 "https://github.com/solana-labs/solana/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p "$HOME/.local/share/solana"
          tar xjf /tmp/solana-release.tar.bz2 -C "$HOME/.local/share/solana"
          echo "$HOME/.local/share/solana/solana-release/bin" >> $GITHUB_PATH

      - name: Setup Wallet
        run: |
          export PATH="$HOME/.local/share/solana/solana-release/bin:$PATH"
          echo "${{ secrets.SOLANA_PRIVATE_KEY }}" > wallet.json
          solana config set --keypair wallet.json --url devnet

      - name: Install Solana BPF Toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26)"

      - name: Build Pinocchio Program with BPF
        working-directory: programs/ginva-pinocchio
        env:
          CARGO_TARGET_BPFEL_UNKNOWN_LINUX_GNU_LINK_LLVM_BIN: /root/.local/share/solana/install/active_release/bin/llvm-objcopy
        run: |
          cargo build-bpf --release

      - name: Run Tests
        if: ${{ !inputs.skip_tests }}
        working-directory: programs/ginva-pinocchio
        run: cargo test --release

      - name: Deploy to Devnet
        if: success()
        run: |
          export PATH="$HOME/.local/share/solana/solana-release/bin:$PATH"
          PROGRAM_SO="programs/ginva-pinocchio/target/release/libginva_pinocchio.so"
          PROGRAM_KEYPAIR="program-keypair.json"
          
          if [ ! -f "$PROGRAM_SO" ]; then
            echo "❌ Program binary not found: $PROGRAM_SO"
            exit 1
          fi
          
          if [ ! -f "$PROGRAM_KEYPAIR" ]; then
            echo "❌ Program keypair not found: $PROGRAM_KEYPAIR"
            exit 1
          fi
          
          PROGRAM_ID=$(solana address -k "$PROGRAM_KEYPAIR")
          echo "Program ID: $PROGRAM_ID"
          
          solana program deploy \
            --program-id "$PROGRAM_KEYPAIR" \
            "$PROGRAM_SO"

      - name: Get Program ID
        if: success()
        id: program-info
        run: |
          export PATH="$HOME/.local/share/solana/solana-release/bin:$PATH"
          PROGRAM_KEYPAIR="program-keypair.json"
          if [ -f "$PROGRAM_KEYPAIR" ]; then
            PROGRAM_ID=$(solana address -k "$PROGRAM_KEYPAIR")
            echo "Program ID: $PROGRAM_ID"
            echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT
          else
            echo "❌ Program keypair not found"
            exit 1
          fi

      - name: Create Deployment Commit
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "deploy: deploy to devnet $(date '+%Y-%m-%d %H:%M')" || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-artifacts
          path: |
            programs/ginva-pinocchio/target/release/libginva_pinocchio.so
            program-keypair.json

  notify:
    name: Notify Deployment
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification
        if: always()
        run: |
          STATUS="${{ needs.build-and-deploy.result }}"
          if [ "$STATUS" == "success" ]; then
            MSG="✅ GINVA deployed to Devnet successfully!"
          else
            MSG="❌ GINVA deployment failed: $STATUS"
          fi
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\n\nCommit: ${{ github.sha }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
        continue-on-error: true
