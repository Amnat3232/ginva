name: 🚀 Auto Deploy to Devnet

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "ginva-vault/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploy"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  SOLANA_VERSION: 1.18.26
  RUST_TOOLCHAIN: stable

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva-pinocchio

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Build Pinocchio Program
        working-directory: programs/ginva-pinocchio
        run: |
          cargo build --release

      - name: Run Tests
        if: ${{ !inputs.skip_tests }}
        working-directory: programs/ginva-pinocchio
        run: |
          cargo test --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            programs/ginva-pinocchio/target/release/libginva_pinocchio.so
            programs/ginva-pinocchio/target/release/ginva-pinocchio

  deploy-devnet:
    name: Deploy to Devnet
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: devnet
      url: https://explorer.solana.com/?cluster=devnet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
        shell: bash -l {0}

      - name: Add Solana to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "Solana CLI installed at: $HOME/.local/share/solana/install/active_release/bin"
          ls -la $HOME/.local/share/solana/install/active_release/bin/

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: programs/ginva-pinocchio/target/release/

      - name: Deploy to Devnet
        run: |
          solana program deploy programs/ginva-pinocchio/target/release/ginva-pinocchio --url devnet --keypair ${{ secrets.SOLANA_KEYPAIR }}
        env:
          SOLANA_CLUSTER: devnet

      - name: Verify Deployment
        run: |
          PROGRAM_ID=$(solana program show programs/ginva-pinocchio/target/release/ginva-pinocchio --url devnet | grep "Program Id:" | awk '{print $3}')
          echo "✅ Deployed to: $PROGRAM_ID"
          echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT
