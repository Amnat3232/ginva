name: 🚀 Auto Deploy to Devnet

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "ginva-vault/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploy"
        type: boolean
        default: false

env:
  SOLANA_VERSION: 1.18.26
  RUST_TOOLCHAIN: nightly-2026-03-01

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva-pinocchio

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Build Pinocchio Program
        working-directory: programs/ginva-pinocchio
        run: |
          cargo build --release

      - name: Run Tests
        if: ${{ !inputs.skip_tests }}
        working-directory: programs/ginva-pinocchio
        run: |
          cargo test --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            programs/ginva-pinocchio/target/release/libginva_pinocchio.so
            programs/ginva-pinocchio/target/release/ginva-pinocchio
