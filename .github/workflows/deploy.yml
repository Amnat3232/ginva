name: 🚀 Deploy to Devnet

on:
  push:
    branches: [develop]
    paths:
      - "programs/**"
      - "Anchor.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "devnet"
        type: choice
        options:
          - devnet
          - mainnet

env:
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.29.0
  RUST_VERSION: 1.77.0

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'devnet' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Setup Solana Keypair
        env:
          DEPLOY_KEYPAIR: ${{ secrets.DEPLOY_KEYPAIR }}
        run: |
          mkdir -p ~/.config/solana
          if [ -n "$DEPLOY_KEYPAIR" ]; then
            echo "$DEPLOY_KEYPAIR" > ~/.config/solana/id.json
          else
            solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
          fi
          solana config set --url ${{ github.event.inputs.environment || 'devnet' }}
          solana address

      - name: Install Anchor CLI
        run: |
          npm install -g @coral-xyz/anchor-cli@${ANCHOR_VERSION}
          anchor --version

      - name: Build Program
        run: anchor build

      - name: Run Tests Before Deploy
        run: anchor test --skip-build
        continue-on-error: true

      - name: Deploy to ${{ github.event.inputs.environment || 'devnet' }}
        run: |
          if [ "${{ github.event.inputs.environment || 'devnet' }}" = "mainnet" ]; then
            anchor deploy --provider.cluster mainnet --skip-test
          else
            anchor deploy --provider.cluster devnet --skip-test
          fi

      - name: Get Program ID
        id: program-id
        run: |
          PROGRAM_ID=$(solana address -k target/deploy/ginva-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_OUTPUT
          echo "Program ID: $PROGRAM_ID"

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.event.inputs.environment || 'devnet' }}
          path: |
            target/deploy/*.so
            target/idl/*.json
            target/types/*.ts
            Anchor.toml

      - name: Create Release Notes
        if: github.event.inputs.environment == 'mainnet'
        uses: actions/github-script@v7
        with:
          script: |
            const programId = '${{ steps.program-id.outputs.PROGRAM_ID }}';
            const body = `## 🚀 Deployment to Mainnet

            **Program ID:** \`${programId}\`
            **Commit:** ${context.sha}
            **Timestamp:** ${new Date().toISOString()}

            ### Verification
            \`\`\`bash
            solana program show ${programId}
            \`\`\`

            ### Changes
            See commit history for detailed changes.`;

            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${new Date().toISOString().split('T')[0]}-${context.sha.slice(0,7)}`,
              name: `Mainnet Deployment - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              draft: true
            });

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event.inputs.environment == 'mainnet' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Program
        run: |
          PROGRAM_ID=$(grep 'declare_id!' programs/ginva/src/lib.rs | grep -oP '(?<=")[A-Za-z0-9]+(?=")')
          echo "Verifying program: $PROGRAM_ID"
          solana program show $PROGRAM_ID --url ${{ github.event.inputs.environment || 'devnet' }}
        continue-on-error: true
