name: 🧪 Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SOLANA_VERSION: "1.18.26"

jobs:
  test:
    name: Run Pinocchio Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/ginva-pinocchio
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Check Rust formatting
        run: cargo fmt --manifest-path programs/ginva-pinocchio/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path programs/ginva-pinocchio/Cargo.toml -- -D warnings

      - name: Build Program
        working-directory: programs/ginva-pinocchio
        run: cargo build --release

      - name: Run Tests
        working-directory: programs/ginva-pinocchio
        run: cargo test --release

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            programs/ginva-pinocchio/target/

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check JavaScript/TypeScript formatting
        run: npm run lint

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path programs/ginva-pinocchio/Cargo.toml -- --check

  test-bots:
    name: Test Keeper Bots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Install bot dependencies
        working-directory: bots
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        working-directory: bots
        run: npx tsc --noEmit --skipLibCheck || true

      - name: Lint bot code
        working-directory: bots
        run: npx eslint .

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Run cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cargo-deny (if configured)
        run: |
          if [ -f deny.toml ]; then
            cargo install cargo-deny || true
            cargo deny check || true
          fi
        working-directory: programs/ginva-pinocchio

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: app
        run: |
          npm install --legacy-peer-deps
          npm run build
        continue-on-error: true

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: app/dist/
        if: success()
