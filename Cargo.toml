[workspace]
resolver = "2"
members = ["programs/ginva"]
exclude = ["programs/ginva_flash_bot"]

[workspace.dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
blake3 = "=1.5.0"
constant_time_eq = "=0.3.1"

# Lock transitive dependencies to avoid edition2024 requirements
cc = "=1.0.83"
jobserver = "=0.1.26"
getrandom = "=0.2.10"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1


